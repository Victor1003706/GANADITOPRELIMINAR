# Render free-tier pilot for the Ganadito API.
# Free instances may sleep/restart and are for pilot validation, not 24/7 production.
services:
  - type: keyvalue
    name: ganadito-redis-free
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: ganadito-api-free
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build --workspace=@ganadito/api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RUN_MIGRATIONS_ON_START
        value: false
      - key: START_WORKERS
        value: true
      - key: PAYMENTS_ENABLED
        value: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ganadito-redis-free
          property: connectionString
