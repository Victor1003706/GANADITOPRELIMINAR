name: Reporte de Fallo (Bug Report)
description: Informa de un error o comportamiento inesperado en Ganadito.
title: "fix: [descripción breve del problema]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Gracias por reportar el problema con evidencia clara y reproducible.
  - type: textarea
    id: description
    attributes:
      label: Descripción del fallo
      description: Explica qué ocurrió de forma concisa.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Enumera los pasos exactos para reproducir el fallo.
      placeholder: |
        1. Ir a '...'
        2. Ejecutar comando '...'
        3. Observar el error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería haber ocurrido.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas de terminal
      description: Pega aquí los mensajes de error relevantes (redacta secretos si existen).
      render: shell
