[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ganadito-ai-satellite"
version = "0.1.0"
description = "Servicio Satélite de Inteligencia Artificial: ExpoGanadito Video Pipeline y Dr. Ganadito Bromatología CIELAB (RM N.° 822-2018/MINSA)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "opencv-python-headless>=4.10.0.84",
  "numpy>=1.26.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
